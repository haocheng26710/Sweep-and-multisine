pipeline_version: 2.0.0-dev.9
schema_versions:
  config: 2.8.0
  measurement: 2.4.0
  feature: 2.1.0

measurement_mode: rew_sweep
run_purpose: software_validation
random_state: 20260804

paths:
  rew_txt: data/exported_txt
  multisine_audio: data/raw_audio/multisine
  stimuli: data/stimuli
  metadata: data/metadata/measurements.csv
  outputs: outputs

preprocessing:
  schema_version: 1.1.0
  provisional: true
  analysis_band_hz: [1000, 8000]
  common_grid_step_hz: 10
  interpolation: linear
  maximum_interpolation_gap_hz: 100
  minimum_valid_grid_fraction: 0.95
  normalization_band_hz: [1000, 8000]
  minimum_normalization_points: 2
  minimum_zscore_std_db: 1.0e-9
  smoothing_domain: db
  smoothing:
    method: none

quality_control:
  schema_version: 1.0.0
  provisional: true
  modes:
    rew_sweep:
      minimum_valid_points: 5
      required_frequency_range_hz: [1000, 8000]
      unavailable_required_check_policy: warning
      phase_policy: optional
      phase_inconsistency_status: warning
      magnitude_db:
        warning_bounds: [-20, 160]
        exclude_candidate_bounds: [-100, 220]
        warning_dynamic_range_db: 100
        exclude_candidate_dynamic_range_db: 160
      required_upstream_checks: []
    schroeder_multisine:
      minimum_valid_points: 5
      required_frequency_range_hz: [1000, 8000]
      unavailable_required_check_policy: warning
      phase_policy: upstream_authoritative
      phase_inconsistency_status: exclude_candidate
      magnitude_db:
        warning_bounds: [-120, 60]
        exclude_candidate_bounds: [-180, 120]
        warning_dynamic_range_db: 100
        exclude_candidate_dynamic_range_db: 160
      required_upstream_checks:
        - p8.aggregate
        - p8.clipping
        - p8.clock_drift
        - p8.non_excited_energy
        - p8.tone.snr
        - p8.tone.leakage
        - p8.tone.period_variance
        - p8.tone.missing_tone

output:
  refuse_existing_run: true
  save_config_snapshot: true
  save_input_hashes: true
