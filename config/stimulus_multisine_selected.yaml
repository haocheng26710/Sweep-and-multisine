measurement_mode: schroeder_multisine

stimulus:
  stimulus_id: ms_selected_placeholder_v1
  tone_set_id: selected_placeholder_v1
  sample_rate_hz: 48000
  period_samples: 4800
  tones:
    mode: explicit
    source: provisional_user_selection
    frequencies_hz: [1200, 1800, 2500, 3400, 4600, 5900, 7200]
  amplitude:
    mode: equal
  phase:
    method: schroeder
    formula: phi_m = -pi*m*(m-1)/M, m=0..M-1
  target_peak_dbfs: -6.0
  wav_format: float32
  pre_silence_s: 0.25
  preamble:
    type: linear_chirp
    duration_s: 0.10
    start_hz: 500
    stop_hz: 10000
    gap_after_s: 0.10
    relative_amplitude: 0.35
  discard_initial_period_count: 2
  stable_period_count: 8
  post_silence_s: 0.25

