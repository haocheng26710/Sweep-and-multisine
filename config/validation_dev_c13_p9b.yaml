measurement_mode: rew_sweep
run_purpose: software_validation
random_state: 20260806

dataset_quality_control:
  aggregation:
    required_unavailable_policy: preserve
    canonical_allowed_statuses: [valid, warning]
    canonical_block_on_required_unavailable: false
    canonical_block_on_manual_review: true

tone_selection:
  enabled: true
  scoring:
    components:
      configuration_gain: {required: false, direction: higher, weight: 1.0}
  selection:
    target_count: 8
    minimum_spacing_hz: 100
    minimum_spacing_bins: 1
    allow_partial: false
    band_quotas: []

tone_projection_ablation:
  enabled: true
  subset_sizes: [3, 4, 5, 6, 8]
  minimum_inner_groups: 2
  minimum_valid_inner_folds: 2
  model: logistic_regression
  minimum_training_features: 2
  minimum_prediction_coverage: 1.0
  decision_policy:
    minimum_p4_retention: 0.80
    maximum_balanced_accuracy_drop: 0.10
    maximum_macro_f1_drop: 0.10
    minimum_prediction_coverage: 1.0
    require_spacing_and_band_quotas: true

direction_metrics:
  minimum_common_valid_features: 2
  minimum_common_valid_fraction: 1.0

comparison_metrics:
  reliability:
    minimum_available_tones: 2
