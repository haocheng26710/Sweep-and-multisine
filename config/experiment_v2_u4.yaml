measurement_mode: rew_sweep

experiment:
  device_version: V2
  configurations: [U4SYM, U4ENC]
  angles_deg: [0, 90, 180, 270]
  require_explicit_group_ids: true

preprocessing:
  analysis_band_hz: [1000, 8000]
  common_grid_step_hz: 10
  interpolation: linear
  normalization_band_hz: [1000, 8000]
  normalization: none
  smoothing:
    method: none
    boundary: reflect

classification:
  validation:
    - leave_one_session_out
    - leave_one_reposition_round_out
    - leave_one_assembly_out
  models:
    - nearest_template_correlation
    - nearest_centroid
    - logistic_regression

